name: Build and push edge images

on:
  push:
    branches:
      - main
  # Weekly rebuild so base-image and toolchain security patches reach the
  # published edge images even in a week with no commits. Nothing here pins a
  # base-image digest, so a rebuild is the only way an upstream CVE fix in
  # node:22-slim or the Go builder actually ships.
  #
  # Not on the hour: GitHub delays scheduled runs during high load and names
  # the start of every hour as a high-load window, so :17 is materially more
  # likely to actually fire.
  #
  # This trigger switches itself off if the repository goes quiet. GitHub
  # disables scheduled workflows in a public repository after 60 days with no
  # repository activity, which is exactly the situation the schedule exists
  # for: a long gap between commits is when a stale base image matters most,
  # and is also when the rebuild stops running. There is no opt-out, so this
  # is documented rather than worked around — a keepalive commit is a worse
  # thing to carry than the gap. Re-enable from the Actions tab or with
  # `gh workflow enable images.yaml`. See
  # docs/contributing.md#weekly-image-rebuild.
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  CONTROLLER_IMAGE: ghcr.io/${{ github.repository }}/controller
  ENGINE_CLAUDE_CODE_IMAGE: ghcr.io/${{ github.repository }}/engine-claude-code
  ENGINE_CLAUDE_CODE_BUILD_IMAGE: ghcr.io/${{ github.repository }}/engine-claude-code-build
  ENGINE_CODEX_IMAGE: ghcr.io/${{ github.repository }}/engine-codex
  ENGINE_OPENCODE_IMAGE: ghcr.io/${{ github.repository }}/engine-opencode
  ENGINE_CLINE_IMAGE: ghcr.io/${{ github.repository }}/engine-cline

jobs:
  controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.CONTROLLER_IMAGE }}
          tags: |
            type=raw,value=main
            type=sha

      - name: Build and push controller image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/controller/Dockerfile
          push: true
          # Without this the runner may reuse a cached base image and the
          # weekly rebuild republishes the same bits it already had.
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  engine-claude-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ENGINE_CLAUDE_CODE_IMAGE }}
          tags: |
            type=raw,value=main
            type=sha

      - name: Build and push engine image
        uses: docker/build-push-action@v6
        with:
          context: docker/engine-claude-code
          file: docker/engine-claude-code/Dockerfile
          push: true
          # Without this the runner may reuse a cached base image and the
          # weekly rebuild republishes the same bits it already had.
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # The build-tools variant is built on the engine image from this same run,
  # by its commit tag, so the two always match and a concurrent push to main
  # cannot slip a different base in between.
  engine-claude-code-build:
    runs-on: ubuntu-latest
    needs: engine-claude-code
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ENGINE_CLAUDE_CODE_BUILD_IMAGE }}
          tags: |
            type=raw,value=main
            type=sha

      - name: Work out the base image tag
        id: base
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push build-tools engine image
        uses: docker/build-push-action@v6
        with:
          context: docker/engine-claude-code-build
          file: docker/engine-claude-code-build/Dockerfile
          build-args: |
            BASE_IMAGE=${{ env.ENGINE_CLAUDE_CODE_IMAGE }}:${{ steps.base.outputs.tag }}
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  engine-codex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ENGINE_CODEX_IMAGE }}
          tags: |
            type=raw,value=main
            type=sha

      - name: Build and push engine image
        uses: docker/build-push-action@v6
        with:
          context: docker/engine-codex
          file: docker/engine-codex/Dockerfile
          push: true
          # Without this the runner may reuse a cached base image and the
          # weekly rebuild republishes the same bits it already had.
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  engine-opencode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ENGINE_OPENCODE_IMAGE }}
          tags: |
            type=raw,value=main
            type=sha

      - name: Build and push engine image
        uses: docker/build-push-action@v6
        with:
          context: docker/engine-opencode
          file: docker/engine-opencode/Dockerfile
          push: true
          # Without this the runner may reuse a cached base image and the
          # weekly rebuild republishes the same bits it already had.
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # engine-cline omitted: Cline is a VS Code extension with no headless
  # CLI mode. The Dockerfile in docker/engine-cline/ is a community
  # contribution template; it cannot produce a working image until a
  # proper headless integration is implemented.

  helm-chart-dev:
    runs-on: ubuntu-latest
    needs:
      - controller
      - engine-claude-code
      - engine-codex
      - engine-opencode
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Package dev chart
        run: |
          helm package charts/osmia \
            --version 0.0.0-edge \
            --app-version "${{ github.sha }}" \
            --destination gh-pages/

      - name: Update repo index
        run: |
          helm repo index gh-pages/ \
            --merge gh-pages/index.yaml \
            --url https://unitaryai.github.io/osmia

      - name: Commit and push to gh-pages
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add osmia-0.0.0-edge.tgz index.yaml
          git commit -m "chore: publish 0.0.0-edge chart (${GITHUB_SHA:0:7})" || echo "Nothing to commit"
          git push
