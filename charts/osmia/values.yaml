# Default values for osmia.

replicaCount: 1

# Use Recreate when a ReadWriteOnce PVC is mounted — RollingUpdate causes
# Multi-Attach errors since the new pod starts before the old one releases
# the volume. Switch to RollingUpdate only if persistence is disabled.
deploymentStrategy: Recreate

image:
  repository: ghcr.io/unitaryai/osmia/controller
  pullPolicy: IfNotPresent
  tag: ""  # Overrides the chart appVersion

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# Controller configuration — mounted as a ConfigMap.
config:
  ticketing:
    backend: github
  secrets:
    backend: k8s
  engines:
    default: claude-code
  guardrails:
    max_cost_per_job: 50.0
    max_concurrent_jobs: 5
    max_job_duration_minutes: 120

metrics:
  enabled: true
  port: 8080
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

podSecurityContext:
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

# Leader election for high-availability deployments.
# NOTE: Not yet implemented — see docs/roadmap.md. Leave disabled until
# the --leader-elect flag is wired in main.go.
leaderElection:
  enabled: false

# Session persistence for agent continuations.
# When enabled, Claude Code session state (~/.claude) and the workspace are
# written to durable storage so retry pods can resume via --resume instead of
# starting fresh. Disabled by default; git-based continuation is the fallback.
sessionPersistence:
  enabled: false
  # backend selects the storage backend: shared-pvc | per-taskrun-pvc | s3
  backend: shared-pvc
  sharedPVC:
    # name of the PVC to create (shared-pvc backend).
    name: osmia-agent-sessions
    size: 10Gi
    storageClass: ""
    # accessMode must be ReadWriteMany for a shared PVC accessed by multiple pods.
    accessMode: ReadWriteMany
  perTaskRunPVC:
    storageClass: ""
    size: 1Gi
  s3:
    bucket: ""
    prefix: "osmia-sessions/"
  # ttlMinutes controls how long session data is retained after a TaskRun
  # reaches a terminal state. Defaults to 1440 (24 hours).
  ttlMinutes: 1440

# External plugin init containers.
# Each entry creates an init container that copies a plugin binary into
# a shared emptyDir volume mounted at /opt/osmia/plugins.
#
# Example:
#   plugins:
#     - name: jira
#       image: ghcr.io/myorg/osmia-plugin-jira:v1.2.0
#       binaryPath: /plugin
#     - name: pagerduty
#       image: ghcr.io/myorg/osmia-plugin-pagerduty:v0.3.1
#       binaryPath: /plugin
plugins: []

# Additional environment variables for the controller container. Combined
# with osmia-config.yaml's ${VAR} substitution, this lets operators inject
# secrets from Kubernetes Secrets without baking them into the chart values.
# Each entry follows the standard core.v1.EnvVar shape (name + value or
# valueFrom). Wrap matching `${VAR}` references inside `config:` in YAML
# double quotes — see the controller config docstring for why this matters.
env: []
#  - name: INCIDENT_IO_WEBHOOK_SECRET
#    valueFrom:
#      secretKeyRef:
#        name: first-responder
#        key: INCIDENT_IO_WEBHOOK_SECRET
# Then inside `config:`:
#   webhook:
#     generic:
#       secret: "${INCIDENT_IO_WEBHOOK_SECRET}"

# Bulk environment-variable sources for the controller container. Useful
# when injecting every key of a Secret or ConfigMap as env vars in one go.
# Each entry follows the standard core.v1.EnvFromSource shape.
envFrom: []
#  - secretRef:
#      name: first-responder

# Webhook receiver — when enabled, the controller accepts webhook events
# in addition to (or instead of) polling the ticketing backend.
webhook:
  enabled: false
  port: 8081
  service:
    type: ClusterIP
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts: []
    #  - host: webhooks.example.com
    #    paths:
    #      - path: /
    #        pathType: Prefix
    tls: []
    #  - secretName: webhooks-tls
    #    hosts:
    #      - webhooks.example.com

# Sandbox — gVisor-based agent isolation with optional warm pools.
sandbox:
  enabled: false
  runtimeClass: gvisor
  warmPool:
    enabled: false
    size: 3
  envStripping: true

# NetworkPolicy — restrict ingress/egress for controller and agent pods.
networkPolicy:
  enabled: false
  agent: {}
    # extraEgressRules: []
  controller: {}
    # webhookSourceCIDR: ""
    # metricsSourceSelector: {}
    # kubeAPIServerCIDR: "0.0.0.0/0"
    # extraIngressRules: []
    # extraEgressRules: []

# PodDisruptionBudget for the controller deployment.
# Annotations for the controller pod. Typical use is keeping a cluster
# autoscaler from evicting it to consolidate nodes, e.g.
#   karpenter.sh/do-not-disrupt: "true"
# The controller tracks running agent jobs in memory, so moving it mid-run
# orphans them. This blocks voluntary disruption only, not spot
# interruption or node failure. Agent pods are annotated separately via
# config.execution.pod_annotations.
podAnnotations: {}

pdb:
  enabled: false
  # minAvailable: 1
  # maxUnavailable: ""

# Persistence — mounts a PVC at /data for SQLite stores (memory, routing, watchdog).
# Disabled by default; enable when using memory, routing, or estimator subsystems.
persistence:
  enabled: false
  size: 1Gi
  storageClass: ""  # leave empty to use cluster default
  accessMode: ReadWriteOnce

# Example: durable TaskRun state via config.taskrun_store (requires persistence.enabled: true).
# Defaults to backend: memory (no durability, matches pre-existing behaviour) when omitted.
# config:
#   taskrun_store:
#     backend: sqlite
#     sqlite:
#       path: /data/taskruns.db

service:
  type: ClusterIP

nodeSelector: {}
tolerations: []
affinity: {}
